version: "3.8"

services:
  spamguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spamguard-nlp-service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    restart: unless-stopped

